services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fireapp
      POSTGRES_PASSWORD: fireapp
      POSTGRES_DB: fireapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  service:
    build: .
    entrypoint: ["uvicorn", "fireapp.service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://fireapp:fireapp@db:5432/fireapp
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights

volumes:
  pgdata:
