[project]
name = "fire-analytics-service"
version = "0.1.0"
description = "Информационно-аналитический сервис мониторинга природных пожаров (КосмоХакатон 2026)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
